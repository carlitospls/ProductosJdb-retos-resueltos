<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Fabricantes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container" style="max-width: 800px;">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-success">🏭 Fabricantes</h2>
        <a th:href="@{/fabricantes/nuevo}" class="btn btn-success">
            <i class="bi bi-plus-lg"></i> Añadir fabricante
        </a>
    </div>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <table class="table table-bordered table-hover bg-white align-middle">
        <thead class="table-dark">
        <tr>
            <th>Código</th>
            <th>Nombre</th>

            <!-- >>> RETO 1 [CONTAR CON JOIN] · paso 6/6 (a) · Cabecera de la columna nueva.
                 Una columna más = revisa el colspan de la fila "No hay fabricantes" (pasó de 4 a 5). -->
            <th>Num productos</th>

            <th class="col-accion">Editar</th>
            <th class="col-accion">Borrar</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(fabricantes)}">
<!--            <td colspan="4" class="text-center text-muted">No hay fabricantes</td>-->
            <td colspan="5" class="text-center text-muted">No hay fabricantes</td>
        </tr>
        <tr th:each="f : ${fabricantes}">
            <td th:text="${f.codigo}">xxxxx</td>

<!--            <td th:text="${f.nombre}">xxxx</td>-->
            <!-- >>> RETO 2 [CONSULTA + PÁGINA NUEVA] · paso 6/6 · El nombre pasa a ser un ENLACE a la página nueva.
                 @{/fabricantes/{codigo}/productos(codigo=${f.codigo})} sustituye {codigo} por el código de esta fila
                 y genera /fabricantes/3/productos. Es la misma sintaxis que el enlace de Editar. -->
            <td>
                <a th:href="@{/fabricantes/{codigo}/productos(codigo=${f.codigo})}"
                   th:text="${f.nombre}">Nombre</a>
            </td>

            <!-- >>> RETO 1 [CONTAR CON JOIN] · paso 6/6 (b) · La celda: ${f.numProductos} llama a getNumProductos()
                 de FabricanteResumen. El th:classappend (color) y el th:disabled del botón Borrar son adornos extra. -->
            <td th:text="${f.numProductos}"
                th:classappend="${f.numProductos > 0}? 'text-bg-primary':'text-bg-secondary'">x</td>

            <td>
                <a th:href="@{/fabricantes/editar/{codigo}(codigo=${f.codigo})}"
                   class="btn btn-warning btn-sm" title="Editar">
                    <i class="bi bi-pencil"></i>
                </a>
            </td>
            <td>
                <form th:action="@{/fabricantes/borrar/{codigo}(codigo=${f.codigo})}" method="post"
                      onsubmit="return confirm('¿Seguro que quieres borrar este fabricante?');">
                    <button type="submit" class="btn btn-danger btn-sm" title="Borrar" th:disabled="${f.numProductos > 0}">
                        <i class="bi bi-trash"></i>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
